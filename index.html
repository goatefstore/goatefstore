<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoatEFStore 3D Tournaments</title>
<style>
body {
  margin:0; font-family:sans-serif; perspective:1000px; background:#111; color:#fff;
}
.cube {
  width: 300px; height: 300px; position:relative; margin:100px auto;
  transform-style: preserve-3d; transition: transform 1s;
}
.face {
  position:absolute; width:300px; height:300px; background:#222; border:2px solid #fff;
  display:flex; align-items:center; justify-content:center; font-size:20px; text-align:center;
}
.front  { transform: rotateY(0deg) translateZ(150px);}
.back   { transform: rotateY(180deg) translateZ(150px);}
.right  { transform: rotateY(90deg) translateZ(150px);}
.left   { transform: rotateY(-90deg) translateZ(150px);}
.top    { transform: rotateX(90deg) translateZ(150px);}
.bottom { transform: rotateX(-90deg) translateZ(150px);}

button { margin-top:20px; padding:10px 20px; cursor:pointer; }

.tournament-list { margin-top:20px; text-align:left; }
.tournament { margin-bottom:10px; padding:10px; border:1px solid #fff; border-radius:10px; }
</style>
</head>
<body>

<div class="cube" id="cube">
  <div class="face front">Welcome! <br><button onclick="showTournaments()">Go to Tournaments</button></div>
  <div class="face back">Admin Panel</div>
  <div class="face right">Info</div>
  <div class="face left">Contact</div>
  <div class="face top">Leaderboard</div>
  <div class="face bottom">Footer</div>
</div>

<div id="tournaments" style="display:none; text-align:center;">
  <h2>Tournaments</h2>
  <div class="tournament-list" id="tournamentList"></div>

  <!-- Admin add tournament -->
  <div id="adminPanel">
    <h3>Add Tournament (Admin)</h3>
    <input type="text" id="tournamentName" placeholder="Tournament Name">
    <button onclick="addTournament()">Add</button>
  </div>
</div>

<script>
// Cube rotation example (3D effect)
let cube = document.getElementById("cube");
function rotateCube(yDeg=0) {
  cube.style.transform = `rotateY(${yDeg}deg)`;
}

// Show tournaments
function showTournaments() {
  document.getElementById("cube").style.display = 'none';
  document.getElementById("tournaments").style.display = 'block';
  loadTournaments();
}

// Tournament storage
function loadTournaments() {
  let tournaments = JSON.parse(localStorage.getItem('tournaments') || "[]");
  let list = document.getElementById('tournamentList');
  list.innerHTML = '';
  tournaments.forEach((t,i) => {
    list.innerHTML += `<div class="tournament">${t.name}<br>Points: ${t.points || 0}</div>`;
  });
}

function addTournament() {
  let name = document.getElementById('tournamentName').value;
  if(!name) return alert("Enter a tournament name");
  let tournaments = JSON.parse(localStorage.getItem('tournaments') || "[]");
  tournaments.push({name, points:0});
  localStorage.setItem('tournaments', JSON.stringify(tournaments));
  document.getElementById('tournamentName').value = '';
  loadTournaments();
}
</script>

</body>
</html>
